version: "3.9"

services:
  # -------------------------------------------------------
  # PostgreSQL — Primary persistent store
  # -------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vedanta_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vedanta
      POSTGRES_USER: vedanta
      POSTGRES_PASSWORD: vedanta_dev_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vedanta -d vedanta"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------
  # Redis — Caching and job queue broker
  # -------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vedanta_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------
  # Backend — FastAPI application
  # -------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vedanta_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql+asyncpg://vedanta:vedanta_dev_password@postgres:5432/vedanta
      - DATABASE_SYNC_URL=postgresql://vedanta:vedanta_dev_password@postgres:5432/vedanta
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -------------------------------------------------------
  # Worker — RQ background worker
  # -------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vedanta_worker
    restart: unless-stopped
    command: python -m app.workers.main
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql+asyncpg://vedanta:vedanta_dev_password@postgres:5432/vedanta
      - DATABASE_SYNC_URL=postgresql://vedanta:vedanta_dev_password@postgres:5432/vedanta
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------------------
  # Frontend — Next.js application
  # -------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vedanta_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: vedanta_network
